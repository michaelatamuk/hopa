name: CI

# Honest constraints of this workflow:
#
# 1. The official HarmonyOS Command Line Tools are behind a Huawei developer
#    login, so they cannot be downloaded anonymously. Mirror the official
#    commandline-tools-*-26.0.0.851.zip somewhere your CI can read and set the
#    repository secrets HARMONY_CLI_TOOLS_URL (and optionally
#    HARMONY_CLI_TOOLS_SHA256). Without them the HAP job skips with a warning
#    instead of pretending to build.
# 2. `hvigorw test` (Local Test) is NOT supported on Linux. The core unit tests
#    therefore run on a macOS runner; the HAP build runs on Linux as requested.
# 3. hopa-bridge and bench are pure Python and run on Linux with no toolchain.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: bridge + evals (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install packages
        run: |
          python -m pip install -U pip
          python -m pip install -e "./services/wire" -e "./services/bridge" -e "./services/relay" -e "./services/evals/bench[dev]" -e "./services/evals/baseline[dev]" "ruff>=0.6" "pytest>=8"
      - name: Ruff
        run: ruff check services/wire services/bridge services/relay services/evals/bench services/evals/baseline
      - name: Ruff format
        run: ruff format --check services/wire services/bridge services/relay services/evals/bench services/evals/baseline
      - name: pytest (wire)
        run: pytest services/wire
      - name: pytest (bridge)
        run: pytest services/bridge
      - name: pytest (relay)
        run: pytest services/relay
      - name: pytest (bench)
        run: pytest services/evals/bench
      - name: pytest (baseline)
        run: pytest services/evals/baseline --cov=hopa_baseline --cov-report=term --cov-fail-under=80
      - name: pytest (plan tooling)
        run: pytest tools/scripts
      - name: Plan lint
        run: python tools/scripts/plan-status.py --lint
      - name: Structure rules
        run: python tools/checks/check-structure.py --strict
      - name: Bridge contract
        run: python services/tools/checks/check-openapi.py
      - name: Conformance fixtures
        run: python tools/checks/check-conformance.py
      - name: Routing fixtures
        run: python tools/checks/check-routing.py
      - name: Android structure
        run: python tools/checks/check-android-structure.py
      - name: Observation hash vector
        run: python tools/checks/check-observation-hash.py
      - name: Tree rules
        run: python tools/checks/check-tree.py
      - name: Render blueprint
        run: python services/tools/checks/check-render.py
      - name: Documentation links
        run: python tools/checks/check-links.py
      - name: Generated app catalogue is current
        run: python tools/scripts/build-app-catalog.py --check
      - name: Generated policy data is current
        run: python tools/scripts/build-policy-data.py --check
      - name: Generated prompt rules are current
        run: python tools/scripts/build-prompt-rules.py --check
      - name: Validate benchmark tasks
        run: python -m hopa_bench validate --tasks services/evals/bench/tasks

  build-hap:
    name: Build HAP (Linux)
    runs-on: ubuntu-latest
    env:
      CLT_URL: ${{ secrets.HARMONY_CLI_TOOLS_URL }}
      CLT_SHA256: ${{ secrets.HARMONY_CLI_TOOLS_SHA256 }}
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain availability
        run: |
          if [ -z "$CLT_URL" ]; then
            echo "::warning title=HarmonyOS toolchain not configured::The official Command Line Tools require a Huawei developer login. Mirror commandline-tools-*-26.0.0.851.zip and set HARMONY_CLI_TOOLS_URL (and HARMONY_CLI_TOOLS_SHA256). Skipping the HAP build."
          else
            echo "Using a mirrored Command Line Tools archive."
          fi

      - name: Restore toolchain cache
        if: env.CLT_URL != ''
        id: clt-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/command-line-tools
          key: harmony-clt-26.0.0.851-${{ runner.os }}

      - name: Download toolchain
        if: env.CLT_URL != '' && steps.clt-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL "$CLT_URL" -o "$RUNNER_TEMP/clt.zip"
          if [ -n "$CLT_SHA256" ]; then
            echo "$CLT_SHA256  $RUNNER_TEMP/clt.zip" | sha256sum -c -
          fi
          mkdir -p "$RUNNER_TEMP/clt"
          unzip -q "$RUNNER_TEMP/clt.zip" -d "$RUNNER_TEMP/clt"
          if [ -d "$RUNNER_TEMP/clt/command-line-tools" ]; then
            mv "$RUNNER_TEMP/clt/command-line-tools" "$RUNNER_TEMP/command-line-tools"
          else
            mv "$RUNNER_TEMP/clt" "$RUNNER_TEMP/command-line-tools"
          fi

      - name: Build
        if: env.CLT_URL != ''
        run: |
          export PATH="$RUNNER_TEMP/command-line-tools/bin:$RUNNER_TEMP/command-line-tools/sdk/default/openharmony/toolchains:$PATH"
          cd apps/harmony
          ohpm install
          hvigorw assembleHap --no-daemon

      - name: Upload HAP
        if: env.CLT_URL != ''
        uses: actions/upload-artifact@v7
        with:
          name: hopa-hap
          path: apps/harmony/phone/build/default/outputs/default/*.hap
          if-no-files-found: error

  brain:
    name: brain (JDK 17 + Kotlin 2.1.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache Kotlin compiler
        uses: actions/cache@v4
        with:
          path: .tools/kotlinc
          key: kotlin-2.1.0-linux
      - name: Install contract-test dependencies
        run: python -m pip install jsonschema
      - name: Compile and test
        run: bash tools/scripts/brain.sh
      - name: Cross-language contract
        run: python tools/scripts/brain-contract.py

  security:
    name: secret and license scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: gitleaks
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --verbose --redact
      - name: License check
        run: python tools/scripts/license-check.py

  core-tests:
    name: core unit tests (macOS, Local Test)
    # hvigorw Local Test is unsupported on Linux; run it on macOS.
    # Off by default: without the macOS CLT secret the job would only skip, but
    # it still queues a macOS runner and makes the whole run look stuck.
    # Enable with the repository variable ENABLE_ARKTS_TESTS=true.
    if: vars.ENABLE_ARKTS_TESTS == 'true'
    runs-on: macos-latest
    env:
      CLT_URL: ${{ secrets.HARMONY_CLI_TOOLS_URL_MACOS }}
      CLT_SHA256: ${{ secrets.HARMONY_CLI_TOOLS_SHA256_MACOS }}
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain availability
        run: |
          if [ -z "$CLT_URL" ]; then
            echo "::warning title=HarmonyOS macOS toolchain not configured::Set HARMONY_CLI_TOOLS_URL_MACOS (and HARMONY_CLI_TOOLS_SHA256_MACOS) to a mirrored commandline-tools-mac-*-26.0.0.851.zip. Skipping core Local Tests."
          fi

      - name: Restore toolchain cache
        if: env.CLT_URL != ''
        id: clt-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/command-line-tools
          key: harmony-clt-macos-26.0.0.851

      - name: Download toolchain
        if: env.CLT_URL != '' && steps.clt-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL "$CLT_URL" -o "$RUNNER_TEMP/clt.zip"
          if [ -n "$CLT_SHA256" ]; then
            echo "$CLT_SHA256  $RUNNER_TEMP/clt.zip" | shasum -a 256 -c -
          fi
          mkdir -p "$RUNNER_TEMP/clt"
          unzip -q "$RUNNER_TEMP/clt.zip" -d "$RUNNER_TEMP/clt"
          if [ -d "$RUNNER_TEMP/clt/command-line-tools" ]; then
            mv "$RUNNER_TEMP/clt/command-line-tools" "$RUNNER_TEMP/command-line-tools"
          else
            mv "$RUNNER_TEMP/clt" "$RUNNER_TEMP/command-line-tools"
          fi

      - name: Run core Local Tests
        if: env.CLT_URL != ''
        run: |
          export PATH="$RUNNER_TEMP/command-line-tools/bin:$RUNNER_TEMP/command-line-tools/sdk/default/openharmony/toolchains:$PATH"
          cd apps/harmony
          ohpm install
          # Do not set DEVECO_SDK_HOME here: a mismatch makes the CLI SDK unavailable.
          hvigorw test -p module=core@default --no-daemon -p coverage=false

  android:
    name: Android (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure Android SDK 35
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Core checks and debug APK
        working-directory: apps/android
        run: ./gradlew :core:check :capabilities:test :capabilities-android:testDebugUnitTest :data:test :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Windows sidecar tests
        working-directory: apps/android
        run: ./gradlew -p ../windows/sidecar test --no-daemon
      - name: Android structure
        run: python3 tools/checks/check-android-structure.py
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: hopa-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    name: Windows client (dotnet)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: gradle/actions/setup-gradle@v4
      - name: Sidecar tests
        working-directory: apps/android
        run: .\gradlew.bat -p ../windows/sidecar test --no-daemon
      - name: Build the client
        working-directory: apps/windows/Hopa.Windows
        run: dotnet build -c Debug
